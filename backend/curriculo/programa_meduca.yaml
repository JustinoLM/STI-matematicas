# Catálogo de lecciones y grafo de prerrequisitos por defecto del STI.
#
# Fuente: programa de Matemática de MEDUCA para 1.º a 6.º de primaria (unidades y lecciones).
# Diseño: docs/DISENO_MODULAR.md, sección 1 → Contenido.
#
# Este archivo es la fuente de verdad. Se carga en la base con:
#     cd backend && poetry run python scripts/cargar_curriculo.py
# El comando valida todo antes de escribir y es idempotente.
#
# Reglas del archivo:
# - El id de una lección es permanente: no se cambia aunque cambie la numeración del programa.
#   Nunca se borra una lección (más adelante tendrá progreso de estudiantes); el cargador se
#   detiene si una lección de la base falta aquí.
# - El orden dentro del programa es la posición de la lección en este archivo.
# - Lección incluida: tiene al menos un camino. Lección no incluida: tiene motivo.
# - parcial: true → el STI solo cubre una parte de la lección; nota_parcial dice cuál.
# - presentacion: presentación especial que necesita la lección (semirrecta, cinta).
# - cubierta_por: la lección ya la atiende un sistema existente (sistema_decimales,
#   modulo_regla_de_tres), que no se toca.
# - prerrequisitos: los mínimos, solo lo necesario para resolver la lección (el orden del
#   programa ya cuenta en el reparto de la sesión). Solo lecciones incluidas, de grado igual
#   o menor, sin ciclos. Grafo completo para 1.º y 2.º; de 3.º a 6.º queda pendiente.

version: 1

caminos:
  # Naturales
  - {id: naturales.numeracion, conjunto: naturales, habilidad: numeracion, nombre: "Numeración de naturales"}
  - {id: naturales.suma, conjunto: naturales, habilidad: suma, nombre: "Suma de naturales"}
  - {id: naturales.resta, conjunto: naturales, habilidad: resta, nombre: "Resta de naturales"}
  - {id: naturales.multiplicacion, conjunto: naturales, habilidad: multiplicacion, nombre: "Multiplicación de naturales"}
  - {id: naturales.division, conjunto: naturales, habilidad: division, nombre: "División de naturales"}
  - {id: naturales.operaciones_combinadas, conjunto: naturales, habilidad: operaciones_combinadas, nombre: "Operaciones combinadas con naturales"}
  - {id: naturales.secuencias, conjunto: naturales, habilidad: secuencias, nombre: "Secuencias y patrones numéricos"}
  - {id: naturales.divisibilidad, conjunto: naturales, habilidad: divisibilidad, nombre: "Divisibilidad, múltiplos y divisores"}
  - {id: naturales.potenciacion, conjunto: naturales, habilidad: potenciacion, nombre: "Potenciación y radicación de naturales"}
  # Decimales (hoy los atiende el sistema actual de decimales)
  - {id: decimales.numeracion, conjunto: decimales, habilidad: numeracion, nombre: "Numeración de decimales"}
  - {id: decimales.suma, conjunto: decimales, habilidad: suma, nombre: "Suma de decimales"}
  - {id: decimales.resta, conjunto: decimales, habilidad: resta, nombre: "Resta de decimales"}
  - {id: decimales.multiplicacion, conjunto: decimales, habilidad: multiplicacion, nombre: "Multiplicación de decimales"}
  - {id: decimales.division, conjunto: decimales, habilidad: division, nombre: "División de decimales"}
  # Fracciones
  - {id: fracciones.numeracion, conjunto: fracciones, habilidad: numeracion, nombre: "Numeración de fracciones"}
  - {id: fracciones.suma, conjunto: fracciones, habilidad: suma, nombre: "Suma de fracciones"}
  - {id: fracciones.resta, conjunto: fracciones, habilidad: resta, nombre: "Resta de fracciones"}
  - {id: fracciones.multiplicacion, conjunto: fracciones, habilidad: multiplicacion, nombre: "Multiplicación de fracciones"}
  - {id: fracciones.division, conjunto: fracciones, habilidad: division, nombre: "División de fracciones"}
  - {id: fracciones.operaciones_combinadas, conjunto: fracciones, habilidad: operaciones_combinadas, nombre: "Operaciones combinadas con fracciones"}
  - {id: fracciones.potenciacion, conjunto: fracciones, habilidad: potenciacion, nombre: "Potenciación y radicación de fracciones"}
  # Enteros
  - {id: enteros.numeracion, conjunto: enteros, habilidad: numeracion, nombre: "Numeración de enteros"}
  - {id: enteros.suma, conjunto: enteros, habilidad: suma, nombre: "Suma de enteros"}
  - {id: enteros.resta, conjunto: enteros, habilidad: resta, nombre: "Resta de enteros"}
  - {id: enteros.multiplicacion, conjunto: enteros, habilidad: multiplicacion, nombre: "Multiplicación de enteros"}
  - {id: enteros.division, conjunto: enteros, habilidad: division, nombre: "División de enteros"}
  # Medida: conversiones entre unidades
  - {id: medida.longitud, conjunto: medida, habilidad: longitud, nombre: "Conversiones de longitud"}
  - {id: medida.masa, conjunto: medida, habilidad: masa, nombre: "Conversiones de masa"}
  - {id: medida.capacidad, conjunto: medida, habilidad: capacidad, nombre: "Conversiones de capacidad"}
  - {id: medida.superficie, conjunto: medida, habilidad: superficie, nombre: "Conversiones de superficie"}
  - {id: medida.tiempo, conjunto: medida, habilidad: tiempo, nombre: "Conversiones y cálculo con tiempo"}
  # Proporcionalidad
  - {id: proporcionalidad.razones, conjunto: proporcionalidad, habilidad: razones, nombre: "Razones"}
  - {id: proporcionalidad.porcentajes, conjunto: proporcionalidad, habilidad: porcentajes, nombre: "Porcentajes"}
  - {id: proporcionalidad.proporciones, conjunto: proporcionalidad, habilidad: proporciones, nombre: "Proporciones y proporcionalidad"}
  - {id: proporcionalidad.regla_de_tres, conjunto: proporcionalidad, habilidad: regla_de_tres, nombre: "Regla de tres"}

grados:

  # ════════════════════════════════════════════════════════════════════════════
  - grado: 1
    unidades:
      - numero: 1
        titulo: "Observo mi entorno"
        lecciones:
          - {id: g1-u01-l01, numero: 1, titulo: "Clasifiquemos objetos", incluida: false,
             motivo: "Prenumérica: clasificar objetos es percepción, no contenido numérico."}
          - {id: g1-u01-l02, numero: 2, titulo: "Comparemos objetos", incluida: false,
             motivo: "Prenumérica: comparar objetos es percepción, no contenido numérico."}
          - {id: g1-u01-l03, numero: 3, titulo: "Identifiquemos patrones", incluida: false,
             motivo: "Prenumérica: patrones de objetos y figuras, no numéricos."}

      - numero: 2
        titulo: "Los números hasta el 10"
        lecciones:
          - {id: g1-u02-l01, numero: 1, titulo: "Conozcamos los números del 0 al 10",
             caminos: [naturales.numeracion], prerrequisitos: []}
          - {id: g1-u02-l02, numero: 2, titulo: "Formemos los números del 2 al 10",
             caminos: [naturales.numeracion], prerrequisitos: [g1-u02-l01]}

      - numero: 3
        titulo: "Suma y resta con números hasta 10"
        lecciones:
          - {id: g1-u03-l01, numero: 1, titulo: "Sumemos de forma horizontal",
             caminos: [naturales.suma], prerrequisitos: [g1-u02-l01]}
          - {id: g1-u03-l02, numero: 2, titulo: "Restemos de forma horizontal",
             caminos: [naturales.resta], prerrequisitos: [g1-u03-l01]}
          - {id: g1-u03-l03, numero: 3, titulo: "Sumemos y restemos 3 números",
             caminos: [naturales.suma, naturales.resta], prerrequisitos: [g1-u03-l02]}

      - numero: 4
        titulo: "Los números hasta el 20"
        lecciones:
          - {id: g1-u04-l01, numero: 1, titulo: "Conozcamos los números del 11 al 20",
             caminos: [naturales.numeracion], prerrequisitos: [g1-u02-l01]}
          - {id: g1-u04-l02, numero: 2, titulo: "Ordenemos y ubiquemos números en la semirrecta",
             caminos: [naturales.numeracion], presentacion: semirrecta, prerrequisitos: [g1-u04-l01],
             notas: "Incluye comparar números menores que 20 con <, > e = (clase 2.4 de Panamáticas)."}
          - {id: g1-u04-l03, numero: 3, titulo: "Contemos de forma progresiva y regresiva",
             caminos: [naturales.numeracion], prerrequisitos: [g1-u04-l01], parcial: true,
             nota_parcial: "Cuenta de 2 en 2 y de 5 en 5 hasta 20; números pares e impares quedan fuera por ahora."}

      - numero: 5
        titulo: "Sumemos y restemos hasta 20"
        lecciones:
          - {id: g1-u05-l01, numero: 1, titulo: "Sumemos 10",
             caminos: [naturales.suma], prerrequisitos: [g1-u03-l01, g1-u04-l01]}
          - {id: g1-u05-l02, numero: 2, titulo: "Sumemos completando a 10",
             caminos: [naturales.suma], prerrequisitos: [g1-u05-l01, g1-u02-l02],
             notas: "Enseña una estrategia: el generador la pide como pasos (9 + 4 = 10 + _ = _), como en Panamáticas."}
          - {id: g1-u05-l03, numero: 3, titulo: "Restemos con números hasta 19",
             caminos: [naturales.resta], prerrequisitos: [g1-u03-l02, g1-u05-l01],
             notas: "Con y sin cruzar la decena, de forma mental (13 − 9 = _ + 3 = _); pedir prestado en columnas es de 2.º."}
          - {id: g1-u05-l04, numero: 4, titulo: "Sumemos y restemos 3 números hasta 20",
             caminos: [naturales.suma, naturales.resta],
             prerrequisitos: [g1-u03-l03, g1-u05-l02, g1-u05-l03]}
          - {id: g1-u05-l05, numero: 5, titulo: "Sumemos y restemos en la semirrecta numérica",
             caminos: [naturales.suma, naturales.resta], presentacion: semirrecta,
             prerrequisitos: [g1-u04-l02, g1-u05-l03]}

      - numero: 6
        titulo: "Los números hasta 99"
        lecciones:
          - {id: g1-u06-l01, numero: 1, titulo: "Agrupemos y contemos de 10 en 10",
             caminos: [naturales.numeracion], prerrequisitos: [g1-u04-l01]}
          - {id: g1-u06-l02, numero: 2, titulo: "Conozcamos los números hasta 99",
             caminos: [naturales.numeracion], prerrequisitos: [g1-u06-l01]}
          - {id: g1-u06-l03, numero: 3, titulo: "Formemos números con unidades y decenas",
             caminos: [naturales.numeracion], prerrequisitos: [g1-u06-l02]}
          - {id: g1-u06-l04, numero: 4, titulo: "Ubiquemos números en la semirrecta numérica",
             caminos: [naturales.numeracion], presentacion: semirrecta,
             prerrequisitos: [g1-u06-l02, g1-u04-l02],
             notas: "Incluye ordenar números de dos cifras (clase 4.3 de Panamáticas)."}
          - {id: g1-u06-l05, numero: 5, titulo: "Comparemos números",
             caminos: [naturales.numeracion], prerrequisitos: [g1-u06-l03]}
          - {id: g1-u06-l06, numero: 6, titulo: "Números ordinales del 1° al 12°", incluida: false,
             motivo: "Ordinales: el diseño los deja para más adelante."}

      - numero: 7
        titulo: "Sumemos y restemos hasta 99"
        lecciones:
          - {id: g1-u07-l01, numero: 1, titulo: "Sumemos con totales hasta 99",
             caminos: [naturales.suma], prerrequisitos: [g1-u06-l03, g1-u05-l01],
             notas: "Sin llevar: llevar empieza en 2.º (g2-u02-l01)."}
          - {id: g1-u07-l02, numero: 2, titulo: "Restemos números hasta 99",
             caminos: [naturales.resta], prerrequisitos: [g1-u07-l01, g1-u05-l03],
             notas: "Sin pedir prestado: pedir prestado empieza en 2.º (g2-u04-l01)."}
          - {id: g1-u07-l03, numero: 3, titulo: "Sumemos y restemos en la semirrecta numérica",
             caminos: [naturales.suma, naturales.resta], presentacion: semirrecta,
             prerrequisitos: [g1-u06-l04, g1-u07-l02],
             notas: "En la semirrecta sí se cruza la decena (35 + 15, 82 − 35): se cuenta de 1, 5 o 10 en 10."}

      - numero: 8
        titulo: "Líneas y formas en mi entorno"
        lecciones:
          - {id: g1-u08-l01, numero: 1, titulo: "Conozcamos las líneas por su forma y posición", incluida: false,
             motivo: "Geometría: el diseño la deja para más adelante."}
          - {id: g1-u08-l02, numero: 2, titulo: "Identifiquemos formas geométricas", incluida: false,
             motivo: "Geometría: el diseño la deja para más adelante."}

      - numero: 9
        titulo: "Sistemas de medidas"
        lecciones:
          - {id: g1-u09-l01, numero: 1, titulo: "Comparemos longitudes", incluida: false,
             motivo: "Comparar longitudes requiere percibir; el diseño la deja para más adelante."}
          - {id: g1-u09-l02, numero: 2, titulo: "Utilicemos las monedas", incluida: false,
             motivo: "Monedas: el diseño las deja para más adelante."}
          - {id: g1-u09-l03, numero: 3, titulo: "Midamos el tiempo", incluida: false,
             motivo: "Lectura del reloj analógico: el diseño la deja para más adelante."}

  # ════════════════════════════════════════════════════════════════════════════
  - grado: 2
    unidades:
      - numero: 1
        titulo: "Conozcamos los números menores de 1000"
        lecciones:
          - {id: g2-u01-l01, numero: 1, titulo: "Analicemos el número 100",
             caminos: [naturales.numeracion], prerrequisitos: [g1-u06-l03]}
          - {id: g2-u01-l02, numero: 2, titulo: "Aprendamos sobre números de 3 cifras",
             caminos: [naturales.numeracion], prerrequisitos: [g2-u01-l01]}
          - {id: g2-u01-l03, numero: 3, titulo: "Preparémonos para la suma y la resta", incluida: false,
             motivo: "Emparejar objetos con colores: no es contenido numérico."}
          - {id: g2-u01-l04, numero: 4, titulo: "Usemos la semirrecta numérica con números de 3 cifras",
             caminos: [naturales.numeracion], presentacion: semirrecta,
             prerrequisitos: [g2-u01-l02, g1-u06-l04]}
          - {id: g2-u01-l05, numero: 5, titulo: "Comparemos números menores de 1000",
             caminos: [naturales.numeracion], prerrequisitos: [g2-u01-l02, g1-u06-l05]}
          - {id: g2-u01-l06, numero: 6, titulo: "Aprendamos sobre números ordinales y números romanos", incluida: false,
             motivo: "Ordinales y números romanos: quedan fuera por ahora."}

      - numero: 2
        titulo: "Aprendamos más sobre la suma"
        lecciones:
          - {id: g2-u02-l01, numero: 1, titulo: "Sumemos números hasta de 2 cifras llevando",
             caminos: [naturales.suma], prerrequisitos: [g1-u07-l01, g1-u05-l02]}
          - {id: g2-u02-l02, numero: 2, titulo: "Reconozcamos características de la suma",
             caminos: [naturales.suma], prerrequisitos: [g1-u07-l01]}
          - {id: g2-u02-l03, numero: 3, titulo: "Sumemos números de 3 cifras sin llevar y llevando",
             caminos: [naturales.suma], prerrequisitos: [g2-u02-l01, g2-u01-l02]}

      - numero: 3
        titulo: "Conozcamos segmentos, rectas y figuras geométricas"
        lecciones:
          - {id: g2-u03-l01, numero: 1, titulo: "Conozcamos puntos, rectas y segmentos", incluida: false,
             motivo: "Geometría: el diseño la deja para más adelante."}
          - {id: g2-u03-l02, numero: 2, titulo: "Aprendamos sobre figuras planas", incluida: false,
             motivo: "Geometría: el diseño la deja para más adelante."}

      - numero: 4
        titulo: "Aprendamos más sobre la resta"
        lecciones:
          - {id: g2-u04-l01, numero: 1, titulo: "Restemos números hasta de 2 cifras pidiendo prestado",
             caminos: [naturales.resta], prerrequisitos: [g1-u07-l02, g2-u02-l01]}
          - {id: g2-u04-l02, numero: 2, titulo: "Restemos números hasta de 3 cifras sin pedir prestado y pidiendo una vez",
             caminos: [naturales.resta], prerrequisitos: [g2-u04-l01, g2-u02-l03]}
          - {id: g2-u04-l03, numero: 3, titulo: "Restemos números hasta de 3 cifras pidiendo prestado 2 veces",
             caminos: [naturales.resta], prerrequisitos: [g2-u04-l02]}
          - {id: g2-u04-l04, numero: 4, titulo: "Sumemos y restemos con la gráfica de cinta",
             caminos: [naturales.suma, naturales.resta], presentacion: cinta,
             prerrequisitos: [g2-u02-l01, g2-u04-l01]}

      - numero: 5
        titulo: "Comencemos a multiplicar"
        lecciones:
          - {id: g2-u05-l01, numero: 1, titulo: "Conozcamos la multiplicación",
             caminos: [naturales.multiplicacion], prerrequisitos: [g1-u07-l01]}
          - {id: g2-u05-l02, numero: 2, titulo: "Conozcamos las tablas de multiplicar del 2 al 5",
             caminos: [naturales.multiplicacion], prerrequisitos: [g2-u05-l01]}

      - numero: 6
        titulo: "Conozcamos medidas de longitud"
        lecciones:
          - {id: g2-u06-l01, numero: 1, titulo: "Conozcamos unidades de medidas de longitud", incluida: false,
             motivo: "Medir con regla e instrumentos requiere percibir; queda fuera por ahora."}
          - {id: g2-u06-l02, numero: 2, titulo: "Sumemos y restemos longitudes",
             caminos: [naturales.suma, naturales.resta], prerrequisitos: [g1-u07-l02],
             notas: "Hueco de cantidad con unidad (25 cm + 13 cm = _ cm). No requiere llevar."}

      - numero: 7
        titulo: "Sigamos multiplicando"
        lecciones:
          - {id: g2-u07-l01, numero: 1, titulo: "Conozcamos las tablas de multiplicar del 6, 7, 8, 9 y 10",
             caminos: [naturales.multiplicacion], prerrequisitos: [g2-u05-l02]}
          - {id: g2-u07-l02, numero: 2, titulo: "Utilicemos la multiplicación",
             caminos: [naturales.multiplicacion], prerrequisitos: [g2-u07-l01]}

      - numero: 8
        titulo: "Conozcamos formas de medir el tiempo y el dinero"
        lecciones:
          - {id: g2-u08-l01, numero: 1, titulo: "Conozcamos formas de medir el tiempo", incluida: false,
             motivo: "Reloj y calendario: quedan fuera por ahora, como el reloj de 1.º."}
          - {id: g2-u08-l02, numero: 2, titulo: "Conozcamos los billetes", incluida: false,
             motivo: "Dinero: queda fuera por ahora, como las monedas de 1.º."}

      - numero: 9
        titulo: "Organicemos datos y reconozcamos secuencias numéricas"
        lecciones:
          - {id: g2-u09-l01, numero: 1, titulo: "Organicemos datos en tablas de frecuencias y gráficas", incluida: false,
             motivo: "Estadística: queda fuera por ahora (revisar en la fase 9)."}
          - {id: g2-u09-l02, numero: 2, titulo: "Reconozcamos patrones y secuencias numéricas",
             caminos: [naturales.secuencias], prerrequisitos: [g1-u04-l03]}

  # ════════════════════════════════════════════════════════════════════════════
  # De 3.º a 6.º: lecciones con su camino; el grafo de prerrequisitos queda pendiente.
  - grado: 3
    unidades:
      - numero: 1
        titulo: "Los números menores de 1 000 000"
        lecciones:
          - {id: g3-u01-l01, numero: 1, titulo: "Escritura y lectura de números menores de 1 000 000", caminos: [naturales.numeracion]}
          - {id: g3-u01-l02, numero: 2, titulo: "Descomposición y composición de números menores de 1 000 000", caminos: [naturales.numeracion]}
          - {id: g3-u01-l03, numero: 3, titulo: "Comparación de números de hasta 6 cifras", caminos: [naturales.numeracion]}
          - {id: g3-u01-l04, numero: 4, titulo: "Aproximación de números menores de 1 000 000", caminos: [naturales.numeracion]}

      - numero: 2
        titulo: "Suma y resta de números de hasta 6 cifras"
        lecciones:
          - {id: g3-u02-l01, numero: 1, titulo: "Suma de números de hasta 6 cifras", caminos: [naturales.suma]}
          - {id: g3-u02-l02, numero: 2, titulo: "Resta de números de hasta 6 cifras", caminos: [naturales.resta]}

      - numero: 3
        titulo: "Ángulos y polígonos"
        lecciones:
          - {id: g3-u03-l01, numero: 1, titulo: "Tipos de ángulos", incluida: false,
             motivo: "Geometría: el diseño la deja para más adelante."}
          - {id: g3-u03-l02, numero: 2, titulo: "Los polígonos", incluida: false,
             motivo: "Geometría: el diseño la deja para más adelante."}

      - numero: 4
        titulo: "La multiplicación"
        lecciones:
          - {id: g3-u04-l01, numero: 1, titulo: "Fijación de las tablas de multiplicar", caminos: [naturales.multiplicacion]}
          - {id: g3-u04-l02, numero: 2, titulo: "Multiplicación de decenas, centenas y unidades de millar por una cifra", caminos: [naturales.multiplicacion]}
          - {id: g3-u04-l03, numero: 3, titulo: "Multiplicación de números de 2 cifras por una cifra", caminos: [naturales.multiplicacion]}
          - {id: g3-u04-l04, numero: 4, titulo: "Multiplicación de números de 3 cifras por una cifra", caminos: [naturales.multiplicacion]}
          - {id: g3-u04-l05, numero: 5, titulo: "Multiplicación por decenas y centenas completas", caminos: [naturales.multiplicacion]}
          - {id: g3-u04-l06, numero: 6, titulo: "Multiplicación por números de 2 o 3 cifras", caminos: [naturales.multiplicacion]}

      - numero: 5
        titulo: "Figuras planas y cuerpos geométricos"
        lecciones:
          - {id: g3-u05-l01, numero: 1, titulo: "El triángulo", incluida: false,
             motivo: "Geometría: el diseño la deja para más adelante."}
          - {id: g3-u05-l02, numero: 2, titulo: "Cuadriláteros: el rectángulo y el cuadrado", incluida: false,
             motivo: "Geometría: el diseño la deja para más adelante."}
          - {id: g3-u05-l03, numero: 3, titulo: "Cálculo del perímetro y el área de un triángulo, un cuadrado y un rectángulo", incluida: false,
             motivo: "Cálculo sobre figuras geométricas: fuera por ahora (revisar en la fase 9)."}
          - {id: g3-u05-l04, numero: 4, titulo: "Cuerpos geométricos", incluida: false,
